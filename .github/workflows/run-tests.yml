name: Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: kotlin-demo-run-tests-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_MODULES: |
        example
      TASKS: |
        :example:testDebugUnitTest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit Tests
        run: |
          set -euo pipefail
          ci/write-google-services.sh $APP_MODULES
          ./gradlew $TASKS

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_MODULES: |
        example
        examplewebview
      TASKS: |
        :example:assembleDebug
        :examplewebview:assembleDebug
        :example:compileDebugAndroidTestKotlin
        :benchmark:compileReleaseAndroidTestKotlin
      SDK_ARTIFACTS: |
        com.useinsider:insider
        com.useinsider:insiderwebview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolved SDK versions
        run: |
          set -euo pipefail
          {
            echo '### Resolved Insider SDK'
            echo '```'
            for artifact in $SDK_ARTIFACTS; do
              ./gradlew -q :example:dependencyInsight --configuration debugRuntimeClasspath --dependency "$artifact" | sed -n 1p
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Integration Tests
        run: |
          set -euo pipefail
          ci/write-google-services.sh $APP_MODULES
          ./gradlew $TASKS
